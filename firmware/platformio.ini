; Plant OS — firmware V0.1
; One project, one environment per milestone. Each milestone is tested in isolation.
;
;   pio run -e m1_soil -t upload          -> Milestone 1: soil moisture sensors
;   pio run -e m2_environment -t upload   -> Milestone 2: BME280 + BH1750
;   pio device monitor                    -> serial output (115200 baud)
;   pio test -e native                    -> unit tests on the host (no hardware)

[platformio]
default_envs = m1_soil

[esp32_base]
platform = espressif32@^6.9.0
board = esp32dev            ; ESP32-DevKitC-32E (WROOM-32E, 4 MB flash)
framework = arduino
monitor_speed = 115200
monitor_filters = time
build_flags = -Wall

[env:m1_soil]
extends = esp32_base
build_src_filter = +<m1_soil/>

[env:m2_environment]
extends = esp32_base
build_src_filter = +<m2_environment/>
lib_deps =
    adafruit/Adafruit BME280 Library@^2.2.4
    claws/BH1750@^1.3.0

[env:native]
platform = native
build_src_filter = -<*>
test_build_src = no
build_flags = -std=c++17 -Wall -Wextra
